name: ticketflow-prod
services:
  db:
    image: ${TICKETFLOW_POSTGRES_IMAGE:-public.ecr.aws/docker/library/postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ticketflow
      POSTGRES_USER: ticketflow
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20", "-c", "work_mem=2MB", "-c", "maintenance_work_mem=16MB"]
    volumes: ["ticketflow_pg:/var/lib/postgresql/data"]
    mem_limit: 192m
    cpus: 0.50
    shm_size: 64m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketflow -d ticketflow"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  api:
    image: ticketflow-api:${TICKETFLOW_RELEASE:?Set TICKETFLOW_RELEASE}
    build:
      context: ..
      dockerfile: ${TICKETFLOW_API_DOCKERFILE:-deploy/Dockerfile.api}
      args:
        PYTHON_BASE: ${TICKETFLOW_PYTHON_BASE:-public.ecr.aws/docker/library/python:3.12-slim}
    env_file: ${TICKETFLOW_ENV_FILE:?Set TICKETFLOW_ENV_FILE}
    environment:
      ATTACHMENT_DIR: /data/attachments
    restart: unless-stopped
    ports: ["127.0.0.1:${TICKETFLOW_API_PORT:-18080}:8000"]
    depends_on:
      db: {condition: service_healthy}
    volumes: ["ticketflow_files:/data/attachments"]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 256m
    cpus: 0.75
    pids_limit: 96
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  ticketflow_pg:
  ticketflow_files:
