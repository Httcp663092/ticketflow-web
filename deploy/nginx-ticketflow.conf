# Include inside the existing HTTPS server; existing routes remain unchanged.
location = /ticketflow { return 301 /ticketflow/; }
location ^~ /ticketflow/api/ {
    client_max_body_size 11m;
    proxy_pass http://127.0.0.1:18080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
}
location ^~ /ticketflow/ {
    root /opt/ticketflow/current/public;
    index index.html;
    try_files $uri $uri/ /ticketflow/index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control "no-cache" always;
}
