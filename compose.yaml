name: ticketflow-dev
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ticketflow
      POSTGRES_USER: ticketflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["ticketflow_dev_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketflow"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      ATTACHMENT_DIR: /data/attachments
      COOKIE_SECURE: "0"
      SESSION_COOKIE_PATH: /api
      TRUSTED_ORIGINS: http://127.0.0.1:15173,http://localhost:15173
    volumes: ["ticketflow_dev_attachments:/data/attachments"]
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["127.0.0.1:18000:8000"]
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports: ["127.0.0.1:15173:5173"]
    depends_on: [backend]
volumes:
  ticketflow_dev_db:
  ticketflow_dev_attachments:
